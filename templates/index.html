<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid AI Assistant - Auth & Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
        button:hover { background: #0369a1; }
        .alt-btn { background: #334155; }
        .alt-btn:hover { background: #475569; }
        #authSection, #chatSection { display: block; }
        #chatSection { display: none; }
        #output { margin-top: 15px; padding: 12px; background: #0f172a; border-radius: 6px; border-left: 4px solid #38bdf8; word-wrap: break-word; }
        .status { margin-top: 10px; font-size: 0.9em; text-align: center; color: #f43f5e; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hybrid AI Assistant</h2>
        
        <!-- Auth Section -->
        <div id="authSection">
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button onclick="handleAuth('/login')">Login</button>
            <button class="alt-btn" onclick="handleAuth('/register')">Register New Account</button>
            <div id="authStatus" class="status"></div>
        </div>

        <!-- AI Assistant Chat Section -->
        <div id="chatSection">
            <p style="color: #4ade80;">Authenticated Successfully!</p>
            <input type="text" id="userInput" placeholder="Ask Groq AI anything...">
            <button onclick="sendPrompt()">Send Prompt</button>
            <div id="output">AI Response will appear here...</div>
        </div>
    </div>

    <script>
        let authToken = "";

        async function handleAuth(endpoint) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('authStatus');

            if(!email || !password) {
                statusDiv.innerText = "Please enter both email and password.";
                return;
            }

            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const result = await response.json();

                if(response.ok) {
                    if(endpoint === '/login') {
                        authToken = result.access_token;
                        document.getElementById('authSection').style.display = 'none';
                        document.getElementById('chatSection').style.display = 'block';
                    } else {
                        statusDiv.style.color = '#4ade80';
                        statusDiv.innerText = result.message;
                    }
                } else {
                    statusDiv.style.color = '#f43f5e';
                    statusDiv.innerText = result.detail || "Error occurred";
                }
            } catch(e) {
                statusDiv.innerText = "Connection failed.";
            }
        }

        async function sendPrompt() {
            const prompt = document.getElementById('userInput').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = "Thinking...";

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const result = await response.json();
                outputDiv.innerText = result.response;
            } catch(e) {
                outputDiv.innerText = "Error connecting to AI backend.";
            }
        }
    </script>
</body>
</html>
